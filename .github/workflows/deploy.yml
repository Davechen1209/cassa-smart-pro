name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pubblicazione a mano, dal pulsante "Run workflow" nella scheda Actions.
  # Serve quando una run fallisce senza che il build parta (nessun runner la
  # prende): senza questo, l'unico modo per ripubblicare lo stesso codice era
  # spingere un altro commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
